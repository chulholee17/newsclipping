<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 뉴스클리핑</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --accent: #1d4ed8;
    --border: #e5e7eb;
    --star: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  h1 { font-size: 1.4rem; margin: 0; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  #updated { color: var(--muted); font-size: 0.85rem; margin: 0 0 20px; }

  section.panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .market-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .market-card canvas { width: 100% !important; height: 140px !important; }
  .market-card .label { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
  .market-card .latest { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
  .market-card .latest .delta { font-size: 0.8rem; font-weight: 500; margin-left: 6px; }
  .delta.up { color: #dc2626; }
  .delta.down { color: #2563eb; }
  .market-empty { color: var(--muted); font-size: 0.85rem; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  #keywordInput {
    flex: 1;
    min-width: 160px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
  }
  #saveBtn, #clearBtn {
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #saveBtn { background: var(--accent); color: #fff; }
  #clearBtn { background: var(--card); color: var(--muted); border: 1px solid var(--border); }
  #saveStatus { font-size: 0.85rem; color: var(--muted); width: 100%; }

  ul#list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li.article {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
  }
  li.article .body { flex: 1; min-width: 0; }
  li.article a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    line-height: 1.4;
  }
  li.article a:hover { color: var(--accent); text-decoration: underline; }
  .meta { margin-top: 6px; color: var(--muted); font-size: 0.8rem; display: flex; gap: 8px; flex-wrap: wrap; }
  .bookmark-btn {
    border: none;
    background: none;
    font-size: 1.3rem;
    cursor: pointer;
    line-height: 1;
    padding: 2px 4px;
    color: var(--border);
  }
  .bookmark-btn.saved { color: var(--star); }
  #empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>내 뉴스클리핑</h1>
  </header>
  <p id="updated">불러오는 중...</p>

  <section class="panel">
    <h2>시장 지표</h2>
    <div class="market-grid" id="marketGrid">
      <p class="market-empty">불러오는 중...</p>
    </div>
    <p class="market-empty" id="marketUpdated" style="margin:10px 0 0"></p>
  </section>

  <div class="tabs" id="tabs"></div>

  <div class="toolbar">
    <input id="keywordInput" type="text" placeholder="키워드로 기사 필터링 (예: 반도체)">
    <button id="saveBtn">현재 목록 오프라인 저장</button>
    <button id="clearBtn">저장 삭제</button>
    <span id="saveStatus"></span>
  </div>

  <ul id="list"></ul>
  <p id="empty" hidden>기사가 없습니다.</p>
</div>

<script>
const STORAGE_KEY = "newsclipping_saved";
const BOOKMARK_KEY = "newsclipping_bookmarks";
const BOOKMARK_TAB = "__bookmarks__";
let data = null;
let currentCategory = null;
let keyword = "";

async function loadNews() {
  try {
    const res = await fetch("news.json", { cache: "no-store" });
    if (!res.ok) throw new Error("news.json fetch failed: " + res.status);
    data = await res.json();
    renderAll();
  } catch (err) {
    console.error(err);
    const saved = loadSaved();
    if (saved) {
      data = saved.data;
      renderAll();
      setStatus("네트워크 오류로 저장된 뉴스를 표시합니다 (저장 시각: " + formatDate(saved.savedAt) + ")");
    } else {
      document.getElementById("updated").textContent = "뉴스를 불러오지 못했습니다.";
    }
  }
}

async function loadMarket() {
  const grid = document.getElementById("marketGrid");
  try {
    const res = await fetch("market.json", { cache: "no-store" });
    if (!res.ok) throw new Error("market.json fetch failed: " + res.status);
    const market = await res.json();
    renderMarket(market);
  } catch (err) {
    console.error(err);
    grid.innerHTML = '<p class="market-empty">시장 지표를 불러오지 못했습니다.</p>';
  }
}

function renderMarket(market) {
  const grid = document.getElementById("marketGrid");
  grid.innerHTML = "";
  const groups = [...(market.fx || []), ...(market.indices || [])];
  if (groups.length === 0) {
    grid.innerHTML = '<p class="market-empty">데이터가 없습니다.</p>';
    return;
  }
  groups.forEach(group => {
    const card = document.createElement("div");
    card.className = "market-card";

    const labelEl = document.createElement("div");
    labelEl.className = "label";
    labelEl.textContent = group.label;
    card.appendChild(labelEl);

    const series = group.series || [];
    const latestEl = document.createElement("div");
    latestEl.className = "latest";
    if (series.length > 0) {
      const last = series[series.length - 1].value;
      const prev = series.length > 1 ? series[series.length - 2].value : last;
      const diff = last - prev;
      const pct = prev !== 0 ? (diff / prev) * 100 : 0;
      const dirClass = diff > 0 ? "up" : diff < 0 ? "down" : "";
      const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "-";
      latestEl.innerHTML = `${last.toLocaleString("ko-KR")}` +
        `<span class="delta ${dirClass}">${arrow} ${Math.abs(pct).toFixed(2)}%</span>`;
    } else {
      latestEl.textContent = "데이터 없음";
    }
    card.appendChild(latestEl);

    const canvas = document.createElement("canvas");
    card.appendChild(canvas);
    grid.appendChild(card);

    if (series.length > 0 && window.Chart) {
      new Chart(canvas.getContext("2d"), {
        type: "line",
        data: {
          labels: series.map(p => p.date.slice(5)),
          datasets: [{
            data: series.map(p => p.value),
            borderColor: "#1d4ed8",
            backgroundColor: "rgba(29,78,216,0.08)",
            fill: true,
            tension: 0.25,
            pointRadius: 0,
            borderWidth: 2,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: true } },
          scales: {
            x: { display: false },
            y: { display: false },
          },
        },
      });
    }
  });

  document.getElementById("marketUpdated").textContent = market.updated_at
    ? "마지막 수집: " + formatDate(market.updated_at)
    : "";
}

function renderAll() {
  renderUpdated();
  renderTabs();
  const first = data.categories[0]?.name ?? null;
  selectCategory(currentCategory || first);
}

function renderUpdated() {
  document.getElementById("updated").textContent = data.updated_at
    ? "마지막 수집: " + formatDate(data.updated_at)
    : "";
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  data.categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "tab-btn";
    btn.textContent = cat.name + " (" + cat.articles.length + ")";
    btn.dataset.name = cat.name;
    btn.addEventListener("click", () => selectCategory(cat.name));
    tabs.appendChild(btn);
  });

  const bookmarkBtn = document.createElement("button");
  bookmarkBtn.className = "tab-btn";
  bookmarkBtn.dataset.name = BOOKMARK_TAB;
  bookmarkBtn.textContent = "★ 저장한 기사 (" + loadBookmarks().length + ")";
  bookmarkBtn.addEventListener("click", () => selectCategory(BOOKMARK_TAB));
  tabs.appendChild(bookmarkBtn);
}

function selectCategory(name) {
  currentCategory = name;
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.name === name);
  });
  applyFilterAndRender();
}

function applyFilterAndRender() {
  let articles;
  if (currentCategory === BOOKMARK_TAB) {
    articles = loadBookmarks();
  } else {
    const cat = data.categories.find(c => c.name === currentCategory);
    articles = cat ? cat.articles : [];
  }
  if (keyword.trim()) {
    const k = keyword.trim().toLowerCase();
    articles = articles.filter(a => a.title.toLowerCase().includes(k));
  }
  renderList(articles);
}

function renderList(articles) {
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  list.innerHTML = "";
  empty.hidden = articles.length > 0;
  const bookmarks = loadBookmarks();
  const bookmarkedLinks = new Set(bookmarks.map(b => b.link));

  articles.forEach(a => {
    const li = document.createElement("li");
    li.className = "article";

    const body = document.createElement("div");
    body.className = "body";
    const link = document.createElement("a");
    link.href = a.link;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = a.title;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = [a.category, a.source, formatDate(a.pub_date)].filter(Boolean).join(" · ");
    body.appendChild(link);
    body.appendChild(meta);

    const star = document.createElement("button");
    star.className = "bookmark-btn" + (bookmarkedLinks.has(a.link) ? " saved" : "");
    star.title = "기사 저장";
    star.textContent = bookmarkedLinks.has(a.link) ? "★" : "☆";
    star.addEventListener("click", () => toggleBookmark(a, star));

    li.appendChild(body);
    li.appendChild(star);
    list.appendChild(li);
  });
}

function toggleBookmark(article, btn) {
  let bookmarks = loadBookmarks();
  const exists = bookmarks.some(b => b.link === article.link);
  if (exists) {
    bookmarks = bookmarks.filter(b => b.link !== article.link);
    btn.classList.remove("saved");
    btn.textContent = "☆";
  } else {
    bookmarks.push(article);
    btn.classList.add("saved");
    btn.textContent = "★";
  }
  localStorage.setItem(BOOKMARK_KEY, JSON.stringify(bookmarks));
  renderTabs();
  document.querySelectorAll(".tab-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.name === currentCategory);
  });
  if (currentCategory === BOOKMARK_TAB) {
    applyFilterAndRender();
  }
}

function loadBookmarks() {
  try {
    const raw = localStorage.getItem(BOOKMARK_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch {
    return [];
  }
}

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString("ko-KR", {
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit",
  });
}

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function setStatus(text) {
  document.getElementById("saveStatus").textContent = text;
}

document.getElementById("keywordInput").addEventListener("input", (e) => {
  keyword = e.target.value;
  applyFilterAndRender();
});

document.getElementById("saveBtn").addEventListener("click", () => {
  if (!data) return;
  const payload = { savedAt: new Date().toISOString(), data };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    setStatus("브라우저에 저장했습니다 (" + formatDate(payload.savedAt) + ")");
  } catch (err) {
    setStatus("저장 실패: " + err.message);
  }
});

document.getElementById("clearBtn").addEventListener("click", () => {
  localStorage.removeItem(STORAGE_KEY);
  setStatus("저장된 내용을 삭제했습니다.");
});

loadNews();
loadMarket();
</script>
</body>
</html>
